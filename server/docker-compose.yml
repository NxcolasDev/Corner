version: '3.9'

services:
  mongodb:
    image: mongo:latest
    container_name: corner-mongodb

    ports:
      - "27018:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: